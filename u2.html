<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Write — Drag & Drop & Direct Selection</title>
  <meta name="description"
    content="Fluen Vocabulary with tactile Drag & Drop, keyboard navigation, in-situ popovers, and unique auto-hide selection matching mobile screenshot design." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-header: #474a52;
      --bg-canvas: #26272b;
      --bg-card: #2e3036;
      --bg-slot: #38393f;
      --border-slot: rgba(255, 255, 255, 0.1);

      --text-main: #ffffff;
      --text-sub: #d5d7dc;
      --text-muted: #8e929b;

      --link-blue: #5ca5e6;
      --progress-blue: #5ca5e6;
      --progress-gold: #8d7339;

      --btn-orange: #f16521;
      --btn-orange-hover: #e05512;
      --btn-blue: #0a74ba;
      --btn-blue-hover: #0863a0;

      --correct-bg: rgba(16, 185, 129, 0.2);
      --correct-border: #10b981;
      --correct-text: #34d399;

      --error-bg: rgba(239, 68, 68, 0.2);
      --error-border: #ef4444;
      --error-text: #f87171;

      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: var(--font);
      background-color: var(--bg-canvas);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .app-viewport {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-canvas);
      position: relative;
    }

    /* ====== STATUS BAR SIMULATION ====== */
    .status-bar-sim {
      height: 18px;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 14px 0;
      font-size: 10px;
      font-weight: 600;
      color: #b0b3ba;
    }

    .status-bar-sim .icons {
      display: flex;
      gap: 5px;
      font-size: 9px;
    }

    /* ====== TOP HEADER (Exact Screenshot Match) ====== */
    .top-header {
      background: var(--bg-header);
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon-circle {
      width: 38px;
      height: 38px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .header-icon-circle svg {
      width: 22px;
      height: 22px;
      fill: #1a1a1a;
    }

    .header-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    /* 4-Color Logo Badge from Screenshot */
    .app-logo-badge {
      width: 26px;
      height: 26px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      padding: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
    }

    .app-logo-badge span {
      border-radius: 2px;
    }

    .app-logo-badge .c-orange {
      background: #f26522;
    }

    .app-logo-badge .c-green {
      background: #42b883;
    }

    .app-logo-badge .c-red {
      background: #ea580c;
    }

    .app-logo-badge .c-blue {
      background: #00aeef;
    }

    /* Progress Divider Line (Split Blue & Gold) */
    .header-progress-line {
      height: 3px;
      width: 100%;
      display: flex;
      background: var(--progress-gold);
    }

    .header-progress-line .blue-fill {
      height: 100%;
      width: 50%;
      background: var(--progress-blue);
      transition: width 0.4s ease;
    }

    /* ====== MAIN CONTENT ====== */
    .main-content {
      flex: 1;
      padding: 16px 18px 160px;
      display: flex;
      flex-direction: column;
    }

    /* Breadcrumbs: Module 3 >> Topics >> Topic 2 */
    .breadcrumb-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--link-blue);
      margin-bottom: 12px;
      cursor: pointer;
    }

    .breadcrumb-link {
      color: var(--link-blue);
      text-decoration: underline;
    }

    .breadcrumb-sep {
      color: var(--link-blue);
      font-size: 11px;
    }

    .breadcrumb-current {
      color: var(--link-blue);
    }

    /* Practice Heading */
    .practice-heading-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .practice-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .set-selector-btn {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--link-blue);
      background: rgba(92, 165, 230, 0.12);
      border: 1px solid rgba(92, 165, 230, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Questions & Bullets (Exact Match) */
    .questions-wrapper {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .q-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .q-header {
      font-size: 15px;
      font-weight: 700;
      color: #f1f3f5;
      line-height: 1.45;
    }

    .q-bullets {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-left: 4px;
    }

    .bullet-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 14.5px;
      color: var(--text-sub);
      line-height: 2.1;
    }

    .bullet-dot {
      color: var(--text-sub);
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    .bullet-text {
      flex: 1;
      font-size: 14.5px;
      color: var(--text-sub);
    }

    /* ====== INLINE BLANK SLOT (TACTILE DOCK & DRAG TARGET) ====== */
    .select-slot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px dashed rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      padding: 2px 14px;
      margin: 0 4px;
      vertical-align: middle;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      color: #e5e7eb;
      min-width: 92px;
      height: 32px;
      justify-content: center;
      user-select: none;
      transition: all 0.2s ease;
      position: relative;
    }

    .select-slot:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(92, 165, 230, 0.5);
    }

    .select-slot.active {
      border: 1.5px solid var(--link-blue);
      box-shadow: 0 0 0 2px rgba(92, 165, 230, 0.35);
      background: rgba(92, 165, 230, 0.12);
    }

    .select-slot.drag-target {
      border: 1.5px dashed #fbbf24;
      background: rgba(251, 191, 36, 0.18);
      transform: scale(1.04);
    }

    .select-slot.filled {
      color: #ffffff;
      font-weight: 700;
      background: #373d4a;
      border: 1.5px solid var(--link-blue);
      padding-right: 26px;
    }

    .select-slot.correct {
      background: var(--correct-bg);
      border: 1.5px solid var(--correct-border);
      color: var(--correct-text);
    }

    .select-slot.incorrect {
      background: var(--error-bg);
      border: 1.5px solid var(--error-border);
      color: var(--error-text);
    }

    .slot-placeholder {
      font-size: 13px;
      font-weight: 700;
      color: #8e929b;
      letter-spacing: 0.04em;
      line-height: 1;
      transition: color 0.15s;
    }

    .select-slot.active .slot-placeholder {
      color: #38bdf8;
      font-weight: 800;
    }

    .slot-clear {
      position: absolute;
      right: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
    }

    .slot-clear:hover {
      background: var(--btn-orange);
    }

    /* ====== TACTILE WORD BANK DOCK ====== */
    .word-dock-sheet {
      position: fixed;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      background: rgba(38, 39, 43, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 16px 8px;
      z-index: 90;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.4);
    }

    .dock-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11.5px;
    }

    .dock-target-info {
      color: var(--link-blue);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dock-unique-hint {
      color: var(--text-muted);
      font-weight: 500;
    }

    .chips-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      max-height: 90px;
      overflow-y: auto;
    }

    .word-chip {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f3f5;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: grab;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      touch-action: none;
      transition: all 0.15s ease;
    }

    .word-chip:hover {
      border-color: var(--link-blue);
      color: var(--link-blue);
      transform: translateY(-1px);
    }

    .word-chip:active {
      cursor: grabbing;
      transform: scale(0.95);
    }

    .word-chip.dragging {
      opacity: 0.35;
    }

    .word-chip .chip-key {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .dock-empty-msg {
      font-size: 12.5px;
      font-weight: 700;
      color: #34d399;
      padding: 6px 0;
      text-align: center;
    }

    /* Floating Drag Avatar for Mobile Touch & Mouse */
    #dragGhostAvatar {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      display: none;
      transform: translate(-50%, -50%);
      background: var(--btn-blue);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.95);
      user-select: none;
      -webkit-user-select: none;
      white-space: nowrap;
      will-change: left, top;
    }

    /* ====== BOTTOM ACTION BUTTONS (Exact Screenshot Match) ====== */
    .bottom-cta-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      height: 58px;
      background: var(--bg-canvas);
      padding: 6px 14px 10px;
      display: flex;
      gap: 4px;
      z-index: 100;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-prev {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: 8px 0 0 8px;
      background: var(--btn-orange);
      color: #ffffff;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-prev:hover {
      background: var(--btn-orange-hover);
    }

    .btn-next {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: 0 8px 8px 0;
      background: var(--btn-blue);
      color: #ffffff;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-next:hover {
      background: var(--btn-blue-hover);
    }

    /* ====== IN-SITU POPOVER ====== */
    .dropdown-popover {
      position: absolute;
      z-index: 250;
      background: #2f3137;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      padding: 6px;
      min-width: 170px;
      max-width: 250px;
      display: none;
      flex-direction: column;
      gap: 4px;
      animation: popoverFadeIn 0.18s ease-out;
    }

    @keyframes popoverFadeIn {
      from {
        opacity: 0;
        transform: translateY(4px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .popover-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 8px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .popover-option {
      padding: 8px 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      background: transparent;
      border: none;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.12s;
    }

    .popover-option:hover {
      background: rgba(92, 165, 230, 0.2);
      color: var(--link-blue);
    }

    .popover-clear-btn {
      color: var(--btn-orange);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 2px;
      font-weight: 700;
    }

    /* ====== EXERCISE SWITCHER MODAL ====== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 540px;
      background: var(--bg-card);
      border-radius: 16px 16px 0 0;
      padding: 18px 20px 24px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
    }

    .modal-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .modal-items-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .modal-exercise-row {
      padding: 12px 14px;
      background: var(--bg-slot);
      border-radius: 8px;
      border: 1px solid var(--border-slot);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-exercise-row.active {
      border-color: var(--link-blue);
      background: rgba(92, 165, 230, 0.15);
    }

    .modal-ex-name {
      font-weight: 700;
      font-size: 14px;
    }

    .modal-ex-info {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Confetti */
    .confetti-particle {
      position: fixed;
      z-index: 400;
      pointer-events: none;
      animation: confettiFall 2.4s ease-out forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="app-viewport">
    <!-- Status Bar Simulation -->
    <div class="status-bar-sim">
      <span>3:10</span>
      <div class="icons">
        <span>📶</span>
        <span>5G</span>
        <span>76%</span>
      </div>
    </div>

    <!-- Top App Header -->
    <header class="top-header">
      <div class="header-left">
        <div class="header-icon-circle" title="Writing Practice">
          <svg viewBox="0 0 24 24">
            <path
              d="M2.5 19.5l4-1 10.5-10.5-3-3L3.5 15.5l-1 4zm14.7-13.8l1.6-1.6c.4-.4 1-.4 1.4 0l1.6 1.6c.4.4.4 1 0 1.4l-1.6 1.6-3-3zM21 21H3c-.6 0-1-.4-1-1s.4-1 1-1h18c.6 0 1 .4 1 1s-.4 1-1 1z" />
          </svg>
        </div>
        <span class="header-title">Write</span>
      </div>
      <div class="header-right">
        <div class="app-logo-badge" onclick="openExerciseModal()" title="Switch Exercise">
          <span class="c-orange"></span>
          <span class="c-green"></span>
          <span class="c-red"></span>
          <span class="c-blue"></span>
        </div>
      </div>
    </header>

    <!-- Split Progress Divider Line -->
    <div class="header-progress-line">
      <div class="blue-fill" id="headerProgressFill"></div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Breadcrumbs -->
      <nav class="breadcrumb-row" onclick="openExerciseModal()">
        <span class="breadcrumb-link">Module 3</span>
        <span class="breadcrumb-sep">&gt;&gt;</span>
        <span class="breadcrumb-link">Topics</span>
        <span class="breadcrumb-sep">&gt;&gt;</span>
        <span class="breadcrumb-current" id="topicBreadcrumb">Topic 2</span>
      </nav>

      <!-- Practice Heading -->
      <div class="practice-heading-wrap">
        <h1 class="practice-title" id="practiceTitle">Practice 2</h1>
        <button class="set-selector-btn" onclick="openExerciseModal()">
          <span id="setIndexBadge">Set 2 / 10</span>
          <span>▾</span>
        </button>
      </div>

      <!-- All Questions Rendered At Once -->
      <div class="questions-wrapper" id="questionsContainer">
        <!-- Rendered dynamically -->
      </div>
    </main>

    <!-- Floating Tactile Word Bank Dock (Drag & Drop + Tap) -->
    <div class="word-dock-sheet" id="wordDockSheet">
      <div class="dock-meta-row">
        <div class="dock-target-info" id="dockTargetInfo">
          <span>Target: Blank 1</span>
        </div>
        <div class="dock-unique-hint">Drag word to slot or tap to fill</div>
      </div>
      <div class="chips-flex" id="chipsContainer">
        <!-- Draggable word chips -->
      </div>
    </div>

    <!-- Bottom CTA Bar (Exact Match: Orange Prev & Blue Next) -->
    <footer class="bottom-cta-bar">
      <button class="btn-prev" id="btnPrev" onclick="onPrevClick()">
        <span>&lt; Prev</span>
      </button>
      <button class="btn-next" id="btnNext" onclick="onNextClick()">
        <span id="nextBtnText">Next &gt;</span>
      </button>
    </footer>
  </div>

  <!-- In-situ Popover Element -->
  <div class="dropdown-popover" id="dropdownPopover">
    <!-- Popover items -->
  </div>

  <!-- Exercise Switcher Modal -->
  <div class="modal-overlay" id="exerciseModal" onclick="closeExerciseModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-title-row">
        <span class="modal-title">Select Practice Topic</span>
        <button class="modal-close-btn" onclick="closeExerciseModal()">✕</button>
      </div>
      <div class="modal-items-list" id="modalItemsList">
        <!-- Items -->
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       DATASET: 10 EXERCISES
       ========================================================= */
    const DATASET = [

      {
        id: 'p1',
        type: 'passage',
        title: 'Practice 1: Observing the head teacher',
        breadcrumbTopic: 'Topic 1',
        instructions: '1. Read the passage and choose the most appropriate terms to complete the sentences.',
        text: 'Today, I watched a busy day at our preschool. The head teacher held a $select$ meeting to plan the daily schedule. $select$ helped decide what the children would learn. The teachers used $select$ to watch how each child was growing. In the afternoon, $select$ helped them choose activities for free play. The helpers prepared materials for $select$. The head teacher also checked $select$ to make sure every child played outside.',
        options: ['observation', 'art and craft', 'outdoor play', 'staff', 'lesson planning', 'activity planning'],
        correct_options: ['staff', 'lesson planning', 'observation', 'activity planning', 'art and craft', 'outdoor play']
      },
      {
        id: 'p2',
        type: 'passage',
        title: 'Practice 3: A day in the play area',
        breadcrumbTopic: 'Topic 3',
        instructions: '1. Choose the appropriate terms to complete the observations.',

    /* =========================================================
       STATE MANAGEMENT
       ========================================================= */
    let currentExerciseIndex = 0;
    let activeGlobalBlank = 0;
    let userAnswers = {};
    let blankMeta = [];
    let isEvaluated = false;

    // Web Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSnd(f = 600, type = 'sine', d = 0.08) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f * 0.5, audioCtx.currentTime + d);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + d);
      } catch (e) { }
    }

    /* =========================================================
       LOAD EXERCISE
       ========================================================= */
    function loadExercise(index) {
      currentExerciseIndex = index;
      userAnswers = {};
      activeGlobalBlank = 0;
      isEvaluated = false;
      blankMeta = [];

      closePopover();

      const ex = DATASET[index];
      document.getElementById('practiceTitle').textContent = ex.title;
      document.getElementById('topicBreadcrumb').textContent = ex.breadcrumbTopic || `Topic ${index + 1}`;
      document.getElementById('setIndexBadge').textContent = `Set ${index + 1} / ${DATASET.length}`;
      document.getElementById('nextBtnText').textContent = 'Next >';

      renderQuestions(ex);
      renderWordDock();
      updateProgress();
      setActiveBlank(0);
    }

    /* =========================================================
       RENDER ALL QUESTIONS AT ONCE
       ========================================================= */
    function renderQuestions(ex) {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';
      let gBlankIdx = 0;

      if (ex.type === 'grouped_sentences') {
        ex.groups.forEach((grp) => {
          const section = document.createElement('div');
          section.className = 'q-section';

          const heading = document.createElement('div');
          heading.className = 'q-header';
          heading.textContent = grp.heading;
          section.appendChild(heading);

          const bullets = document.createElement('div');
          bullets.className = 'q-bullets';

          grp.sentences.forEach((sentence) => {
            const row = document.createElement('div');
            row.className = 'bullet-row';

            const dot = document.createElement('span');
            dot.className = 'bullet-dot';
            dot.textContent = '•';

            const textWrap = document.createElement('div');
            textWrap.className = 'bullet-text';

            const parts = sentence.split('$select$');
            parts.forEach((p, pIdx) => {
              textWrap.appendChild(document.createTextNode(p));
              if (pIdx < parts.length - 1) {
                const bIdx = gBlankIdx++;
                blankMeta.push({
                  index: bIdx,
                  options: grp.options,
                  expected: grp.answers[pIdx] || grp.answers[0]
                });
                textWrap.appendChild(createSlotElement(bIdx));
              }
            });

            row.appendChild(dot);
            row.appendChild(textWrap);
            bullets.appendChild(row);
          });

          section.appendChild(bullets);
          container.appendChild(section);
        });
      } else {
        // Passage Mode
        const section = document.createElement('div');
        section.className = 'q-section';

        const heading = document.createElement('div');
        heading.className = 'q-header';
        heading.textContent = ex.instructions || '1. Read the passage and complete the sentences.';
        section.appendChild(heading);

        const bullets = document.createElement('div');
        bullets.className = 'q-bullets';

        const row = document.createElement('div');
        row.className = 'bullet-row';

        const dot = document.createElement('span');
        dot.className = 'bullet-dot';
        dot.textContent = '•';

        const textWrap = document.createElement('div');
        textWrap.className = 'bullet-text';

        const parts = ex.text.split('$select$');
        parts.forEach((p, pIdx) => {
          textWrap.appendChild(document.createTextNode(p));
          if (pIdx < parts.length - 1) {
            const bIdx = gBlankIdx++;
            blankMeta.push({
              index: bIdx,
              options: ex.options,
              expected: ex.correct_options[bIdx]
            });
            textWrap.appendChild(createSlotElement(bIdx));
          }
        });

        row.appendChild(dot);
        row.appendChild(textWrap);
        bullets.appendChild(row);
        section.appendChild(bullets);
        container.appendChild(section);
      }
    }

    function createSlotElement(idx) {
      const slot = document.createElement('span');
      slot.className = `select-slot ${idx === 0 ? 'active' : ''}`;
      slot.id = `slot-${idx}`;
      slot.setAttribute('data-index', idx);
      slot.innerHTML = `<span class="slot-placeholder">________</span>`;

      slot.addEventListener('click', (e) => {
        e.stopPropagation();
        playSnd(500, 'sine', 0.05);
        if (userAnswers[idx]) {
          togglePopover(idx, slot);
        } else {
          setActiveBlank(idx);
        }
      });

      slot.addEventListener('dragover', (e) => {
        e.preventDefault();
        slot.classList.add('drag-target');
      });
      slot.addEventListener('dragleave', () => {
        slot.classList.remove('drag-target');
      });
      slot.addEventListener('drop', (e) => {
        e.preventDefault();
        slot.classList.remove('drag-target');
        const word = e.dataTransfer.getData('text/plain');
        if (word) {
          assignWord(idx, word);
        }
      });

      return slot;
    }

    /* =========================================================
       WORD BANK (DRAGGABLE + TAP-TO-PLACE + UNIQUE AUTO-HIDE)
       ========================================================= */
    function renderWordDock() {
      const chipsContainer = document.getElementById('chipsContainer');
      chipsContainer.innerHTML = '';

      if (!blankMeta[activeGlobalBlank]) return;
      const currentMeta = blankMeta[activeGlobalBlank];
      const usedWords = Object.values(userAnswers);

      let availableCount = 0;
      currentMeta.options.forEach((opt) => {
        if (usedWords.includes(opt)) {
          return;
        }

        availableCount++;
        const chip = document.createElement('button');
        chip.className = 'word-chip';
        chip.setAttribute('type', 'button');
        chip.innerHTML = `<span class="chip-key">${availableCount}</span><span>${opt}</span>`;

        // Prevent native HTML5 drag interference so pointer events take full control on mobile & desktop
        chip.addEventListener('dragstart', (e) => e.preventDefault());

        // Mobile Touch & Pointer Drag and Tap Handler
        let startX = 0;
        let startY = 0;
        let isDragging = false;
        const dragGhost = document.getElementById('dragGhostAvatar');

        function onPointerDown(e) {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          if (isEvaluated) return;

          startX = e.clientX;
          startY = e.clientY;
          isDragging = false;

          try {
            chip.setPointerCapture(e.pointerId);
          } catch (err) {}

          function onPointerMove(moveEvent) {
            const dx = moveEvent.clientX - startX;
            const dy = moveEvent.clientY - startY;

            // 5px threshold to separate quick tap from drag
            if (!isDragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
              isDragging = true;
              chip.classList.add('dragging');
              playSnd(520, 'sine', 0.05);

              if (dragGhost) {
                dragGhost.textContent = opt;
                dragGhost.style.display = 'block';
                dragGhost.style.left = `${moveEvent.clientX}px`;
                dragGhost.style.top = `${moveEvent.clientY}px`;
              }
            }

            if (isDragging && dragGhost) {
              dragGhost.style.left = `${moveEvent.clientX}px`;
              dragGhost.style.top = `${moveEvent.clientY}px`;

              // Detect slot under finger/pointer
              const elBelow = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY);
              const dropSlot = elBelow ? elBelow.closest('.select-slot') : null;

              document.querySelectorAll('.select-slot').forEach(s => s.classList.remove('drag-target'));
              if (dropSlot) {
                dropSlot.classList.add('drag-target');
              }
            }
          }

          function onPointerUp(upEvent) {
            try {
              chip.releasePointerCapture(upEvent.pointerId);
            } catch (err) {}

            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            window.removeEventListener('pointercancel', onPointerUp);

            chip.classList.remove('dragging');
            if (dragGhost) dragGhost.style.display = 'none';
            document.querySelectorAll('.select-slot').forEach(s => s.classList.remove('drag-target'));

            if (isDragging) {
              isDragging = false;
              const elBelow = document.elementFromPoint(upEvent.clientX, upEvent.clientY);
              const dropSlot = elBelow ? elBelow.closest('.select-slot') : null;

              if (dropSlot) {
                const targetIdx = parseInt(dropSlot.getAttribute('data-index'), 10);
                assignWord(targetIdx, opt);
              } else {
                playSnd(280, 'sine', 0.07);
              }
            } else {
              // Quick tap: Assign directly to the active focused slot
              assignWord(activeGlobalBlank, opt);
            }
          }

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
          window.addEventListener('pointercancel', onPointerUp);
        }

        chip.addEventListener('pointerdown', onPointerDown);

        chipsContainer.appendChild(chip);
      });

      if (availableCount === 0) {
        chipsContainer.innerHTML = `<div class="dock-empty-msg">✓ All options assigned for this section</div>`;
      }

      document.getElementById('dockTargetInfo').innerHTML = `<span>Target: Blank ${activeGlobalBlank + 1} of ${blankMeta.length}</span>`;
    }

    function setActiveBlank(idx) {
      if (isEvaluated) return;
      activeGlobalBlank = idx;

      document.querySelectorAll('.select-slot').forEach((slot, i) => {
        slot.classList.toggle('active', i === idx);
      });

      renderWordDock();
    }

    function assignWord(blankIdx, word) {
      if (isEvaluated) return;
      playSnd(660, 'triangle', 0.08);

      // Unique assignment
      Object.keys(userAnswers).forEach(k => {
        if (userAnswers[k] === word) {
          delete userAnswers[k];
          updateSlotUI(parseInt(k, 10));
        }
      });

      userAnswers[blankIdx] = word;
      updateSlotUI(blankIdx);

      // Auto-advance
      let nextEmpty = -1;
      for (let i = 0; i < blankMeta.length; i++) {
        if (!userAnswers[i]) {
          nextEmpty = i;
          break;
        }
      }

      if (nextEmpty !== -1) {
        setActiveBlank(nextEmpty);
      } else {
        setActiveBlank(blankIdx);
      }

      closePopover();
      updateProgress();
      renderWordDock();
    }

    function clearSlot(e, idx) {
      if (e) e.stopPropagation();
      playSnd(360, 'sine', 0.07);

      delete userAnswers[idx];
      updateSlotUI(idx);
      setActiveBlank(idx);
      closePopover();
      updateProgress();
      renderWordDock();
    }

    function updateSlotUI(idx) {
      const slot = document.getElementById(`slot-${idx}`);
      if (!slot) return;

      const val = userAnswers[idx];
      if (val) {
        slot.className = 'select-slot filled';
        slot.innerHTML = `<span>${val}</span><span class="slot-clear" onclick="clearSlot(event, ${idx})" title="Clear">✕</span>`;
      } else {
        slot.className = 'select-slot';
        slot.innerHTML = `<span class="slot-placeholder">________</span>`;
      }
    }

    function updateProgress() {
      const total = blankMeta.length;
      const filled = Object.keys(userAnswers).length;
      const pct = Math.round((filled / total) * 100);

      document.getElementById('headerProgressFill').style.width = `${Math.max(15, pct)}%`;

      const nextBtnText = document.getElementById('nextBtnText');
      if (filled === total && !isEvaluated) {
        nextBtnText.textContent = 'Check ✓';
      } else if (isEvaluated) {
        nextBtnText.textContent = 'Next >';
      } else {
        nextBtnText.textContent = 'Next >';
      }
    }

    /* =========================================================
       IN-SITU POPOVER
       ========================================================= */
    function togglePopover(idx, slotEl) {
      if (isEvaluated) return;
      const popover = document.getElementById('dropdownPopover');
      popover.innerHTML = '';

      const meta = blankMeta[idx];
      const usedWords = Object.values(userAnswers);

      const header = document.createElement('div');
      header.className = 'popover-header';
      header.textContent = `Choose answer:`;
      popover.appendChild(header);

      meta.options.forEach((opt) => {
        if (usedWords.includes(opt) && userAnswers[idx] !== opt) {
          return;
        }

        const btn = document.createElement('button');
        btn.className = 'popover-option';
        btn.innerHTML = `<span>${opt}</span>${userAnswers[idx] === opt ? '<span>✓</span>' : ''}`;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          assignWord(idx, opt);
        });
        popover.appendChild(btn);
      });

      if (userAnswers[idx]) {
        const clearBtn = document.createElement('button');
        clearBtn.className = 'popover-option popover-clear-btn';
        clearBtn.innerHTML = `<span>Remove selection</span><span>✕</span>`;
        clearBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          clearSlot(e, idx);
        });
        popover.appendChild(clearBtn);
      }

      const rect = slotEl.getBoundingClientRect();
      popover.style.display = 'flex';
      popover.style.top = `${rect.bottom + window.scrollY + 6}px`;

      const popoverWidth = 200;
      let leftPos = rect.left + window.scrollX;
      if (leftPos + popoverWidth > window.innerWidth - 16) {
        leftPos = window.innerWidth - popoverWidth - 16;
      }
      popover.style.left = `${Math.max(10, leftPos)}px`;
    }

    function closePopover() {
      const popover = document.getElementById('dropdownPopover');
      if (popover) popover.style.display = 'none';
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#dropdownPopover') && !e.target.closest('.select-slot')) {
        closePopover();
      }
    });

    /* =========================================================
       EVALUATION & BUTTON NAVIGATION
       ========================================================= */
    function onNextClick() {
      const total = blankMeta.length;
      const filled = Object.keys(userAnswers).length;

      if (!isEvaluated) {
        if (filled < total) {
          for (let i = 0; i < total; i++) {
            if (!userAnswers[i]) {
              setActiveBlank(i);
              const slot = document.getElementById(`slot-${i}`);
              if (slot) slot.scrollIntoView({ behavior: 'smooth', block: 'center' });
              break;
            }
          }
          return;
        }

        isEvaluated = true;
        closePopover();
        let ok = 0;
        for (let i = 0; i < total; i++) {
          const slot = document.getElementById(`slot-${i}`);
          const userVal = (userAnswers[i] || '').trim().toLowerCase();
          const expectedVal = (blankMeta[i].expected || '').trim().toLowerCase();

          if (slot) {
            if (userVal === expectedVal) {
              slot.classList.add('correct');
              slot.classList.remove('incorrect');
              ok++;
            } else {
              slot.classList.add('incorrect');
              slot.classList.remove('correct');
              slot.title = `Correct: ${blankMeta[i].expected}`;
            }
          }
        }

        if (ok === total) {
          playSnd(880, 'triangle', 0.2);
          launchConfetti();
        } else {
          playSnd(300, 'sawtooth', 0.25);
        }

        document.getElementById('nextBtnText').textContent = 'Next >';
        return;
      }

      const nextIdx = (currentExerciseIndex + 1) % DATASET.length;
      loadExercise(nextIdx);
    }

    function onPrevClick() {
      if (isEvaluated) {
        loadExercise(currentExerciseIndex);
      } else {
        const prevIdx = (currentExerciseIndex - 1 + DATASET.length) % DATASET.length;
        loadExercise(prevIdx);
      }
    }

    /* =========================================================
       KEYBOARD SHORTCUTS
       ========================================================= */
    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '9') {
        const index = parseInt(e.key, 10) - 1;
        const chips = document.querySelectorAll('.chips-flex .word-chip');
        if (chips[index]) {
          chips[index].click();
        }
      } else if (e.key === 'Enter') {
        onNextClick();
      } else if (e.key === 'Backspace' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        if (userAnswers[activeGlobalBlank]) {
          clearSlot(null, activeGlobalBlank);
        }
      } else if (e.key === 'ArrowRight' || e.key === 'Tab') {
        e.preventDefault();
        const total = blankMeta.length;
        setActiveBlank((activeGlobalBlank + 1) % total);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        const total = blankMeta.length;
        setActiveBlank((activeGlobalBlank - 1 + total) % total);
      }
    });

    /* =========================================================
       MODAL NAVIGATION
       ========================================================= */
    function openExerciseModal() {
      const list = document.getElementById('modalItemsList');
      list.innerHTML = '';

      DATASET.forEach((ex, idx) => {
        const row = document.createElement('div');
        row.className = `modal-exercise-row ${idx === currentExerciseIndex ? 'active' : ''}`;
        row.innerHTML = `
          <div>
            <div class="modal-ex-name">${ex.title}</div>
            <div class="modal-ex-info">${ex.type === 'passage' ? 'Passage' : 'Grammar Groups'} · Unique Selection</div>
          </div>
          <span style="color: var(--link-blue); font-weight: 700;">Open &gt;</span>
        `;
        row.addEventListener('click', () => {
          loadExercise(idx);
          closeExerciseModal();
        });
        list.appendChild(row);
      });

      document.getElementById('exerciseModal').classList.add('open');
    }

    function closeExerciseModal(e) {
      if (e && e.target !== document.getElementById('exerciseModal') && !e.target.closest('.modal-close-btn')) {
        return;
      }
      document.getElementById('exerciseModal').classList.remove('open');
    }

    /* =========================================================
       CONFETTI
       ========================================================= */
    function launchConfetti() {
      const colors = ['#f16521', '#0a74ba', '#42b883', '#5ca5e6', '#fbbf24'];
      for (let i = 0; i < 35; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-particle';
        const size = Math.random() * 8 + 6;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = `${Math.random() * 100}vw`;
        p.style.top = '-10px';
        p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 2500);
      }
    }

    /* =========================================================
       INIT
       ========================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      loadExercise(0);
    });
  </script>

  <!-- Mobile Touch & Pointer Drag Avatar -->
  <div id="dragGhostAvatar"></div>
</body>
